<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#050914">
<meta name="color-scheme" content="dark">
<title>KotakApp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=12">
</head>
<body>
<script>
(function(){try{
  var V='12',k='kotak_ver';
  if(localStorage.getItem(k)!==V){
    localStorage.setItem(k,V);
    var jobs=[];
    if('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister();}));}));
    if(window.caches) jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(x){return caches.delete(x);}));}));
    Promise.all(jobs).then(function(){ location.reload(); }).catch(function(){});
  }
}catch(e){}})();
</script>
<div class="boot" id="boot"><img class="boot-logo" src="icon-192.png" alt="KotakApp" width="112" height="112"></div>
<div class="auth-wrap" id="auth-wrap">
  <form class="auth-card" id="auth-form">
    <div class="logo auth-logo"><img class="logo-img" src="logo-mark.png" alt="" width="56" height="54"><span class="wm">Kotak<b>App</b></span></div>
    <h1 id="auth-title">С возвращением</h1>
    <p class="muted" id="auth-hint">Войди в свой аккаунт KotakApp</p>
    <label>Username<input id="auth-username" autocomplete="username" minlength="3" maxlength="24" placeholder="например, alex_01" required></label>
    <label>Пароль<input id="auth-password" type="password" autocomplete="current-password" minlength="8" placeholder="Не менее 8 символов" required></label>
    <button class="primary" id="auth-submit">Войти</button>
    <p class="auth-error" id="auth-error" role="alert"></p>
    <button class="switch-auth" type="button" id="auth-switch">Нет аккаунта? Зарегистрироваться</button>
    <p class="tiny muted">Регистрация по username. Для восстановления пароля позже добавим подтверждённый способ связи.</p>
  </form>
</div>
<div class="app" id="app" data-view="list" hidden>
  <aside class="side" id="side" data-tab="chats">
    <header class="side-head"><div class="logo"><img class="logo-img" src="logo-mark.png" alt="" width="46" height="44"><span class="wm">Kotak<b>App</b></span></div>
      <div class="head-btns"><button type="button" class="round" id="h-search" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><button type="button" class="round" id="h-menu" aria-label="Меню"><svg viewBox="0 0 24 24" class="fill"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button></div>
      <div class="menu" id="menu" hidden><button type="button" id="m-group">Новая группа</button><button type="button" id="m-settings">Настройки</button></div>
    </header>
    <div class="pane" id="pane-chats">
      <div class="search"><input id="q" type="search" placeholder="Поиск чатов" autocomplete="off"><button type="button" class="filter" id="q-filter" aria-label="Только непрочитанные" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div>
      <ul class="list" id="chat-list"></ul>
    </div>
    <div class="pane" id="pane-contacts" hidden>
      <div class="search"><input id="user-search" type="search" placeholder="Найти по username" autocomplete="off"></div>
      <ul class="list" id="contact-list"></ul>
    </div>
    <div class="pane" id="pane-settings" hidden>
      <div class="settings"><h2 class="ptitle">Настройки</h2><button class="secondary" id="push-btn">Включить уведомления</button><button class="secondary" id="diag">Проверить базу данных</button><p class="tiny muted" id="ver"></p></div>
    </div>
    <div class="pane" id="pane-profile" hidden>
      <div class="profile"><div class="avatar big" id="me-av"></div><h2 id="me-name"></h2><p class="muted" id="me-user"></p><button class="secondary" id="logout">Выйти из аккаунта</button></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="chats" class="on"><svg viewBox="0 0 24 24" class="fill"><path d="M9.5 3.5C5.4 3.5 2 6.4 2 10c0 1.7.8 3.3 2.100 4.400-.1 1.300-.6 2.300-1.300 3.100 1.800-.1 3.200-.8 4.200-1.600.8.2 1.600.3 2.500.3 4.100 0 7.500-2.900 7.500-6.500S13.600 3.500 9.500 3.500z"/><path d="M17.800 9.300c2.300.8 4.200 2.600 4.200 5 0 1.500-.8 2.800-2 3.800.1 1 .5 1.800 1 2.400-1.400-.1-2.500-.6-3.300-1.300-.6.200-1.300.3-2 .3-2.200 0-4.100-.9-5.200-2.300 5.300-.3 8.500-3.700 7.300-7.900z" opacity=".75"/></svg><span>Чаты</span></button><button data-tab="contacts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.500"/><circle cx="12" cy="10" r="3.200"/><path d="M5.800 18.500c1.300-2.400 3.500-3.500 6.200-3.500s4.900 1.100 6.200 3.500"/></svg><span>Контакты</span></button><button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M10.300 3h3.400l.5 2.300c.6.200 1.100.5 1.600.9l2.200-.8 1.700 3-1.700 1.500c.1.600.1 1.200 0 1.800l1.700 1.500-1.700 3-2.200-.8c-.5.400-1 .7-1.600.9l-.5 2.300h-3.400l-.5-2.300c-.6-.2-1.100-.5-1.600-.9l-2.200.8-1.700-3 1.700-1.500c-.1-.6-.1-1.200 0-1.800L4.300 8.400l1.700-3 2.200.8c.5-.4 1-.7 1.600-.9z"/><circle cx="12" cy="12" r="3"/></svg><span>Настройки</span></button><button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.500" r="4"/><path d="M4.500 20.500c.8-3.700 3.700-5.700 7.500-5.700s6.700 2 7.500 5.700"/></svg><span>Профиль</span></button>
    </nav>
    <button type="button" class="fab" id="fab" aria-label="Новое сообщение"><svg viewBox="0 0 24 24"><path d="M4 20l1-4.200L16.800 4a2 2 0 0 1 2.800 0l.4.400a2 2 0 0 1 0 2.800L8.200 19z"/><path d="M14.500 6.500l3 3"/></svg></button>
  </aside>
  <main class="chat">
    <div class="empty" id="empty"><img src="logo-mark.png" alt="" width="120" height="116"><p>Выберите чат, чтобы начать</p></div>
    <section class="room" id="room" hidden>
      <header class="room-head"><button class="back" id="back" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="avatar" id="room-av"></div><div><div class="title" id="room-title"></div><div class="muted small" id="room-sub">KotakApp</div></div></header>
      <div class="msgs" id="msgs"></div>
      <div class="reply-bar" id="reply-bar" hidden><span id="reply-text"></span><button id="reply-x" aria-label="Отменить ответ">×</button></div>
      <form class="composer" id="composer" autocomplete="off"><textarea id="text" name="kotak-msg" rows="1" placeholder="Сообщение" autocomplete="off" maxlength="5000" enterkeyhint="send" data-lpignore="true" data-form-type="other"></textarea><div class="recbar" id="recbar" hidden><button type="button" id="rec-cancel" aria-label="Отменить запись">✕</button><span class="recdot"></span><span id="rec-time">0:00</span></div><button type="button" class="mic" id="mic" aria-label="Записать голосовое"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="send" id="send-btn" aria-label="Отправить" hidden><svg viewBox="0 0 24 24"><path d="M12 19V5M5.500 11.500L12 5l6.500 6.500"/></svg></button></form>
    </section>
  </main>
</div>
<div class="sheet" id="group-sheet" hidden><div class="sheet-body gbody">
  <h3>Новая группа</h3>
  <input id="g-title" maxlength="60" placeholder="Название группы" autocomplete="off">
  <input id="g-search" type="search" placeholder="Найти участника по username" autocomplete="off">
  <div class="gsel" id="g-sel"></div>
  <ul class="list" id="g-results"></ul>
  <button type="button" class="primary" id="g-create">Создать группу</button>
  <button type="button" id="g-cancel" class="muted">Отмена</button>
</div></div>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet" hidden><div class="sheet-body"><div class="react-row" id="react-row"></div><button id="act-reply">Ответить</button><button id="act-edit">Изменить</button><button id="act-del-me">Удалить у меня</button><button id="act-del-all">Удалить у всех</button><button id="act-close" class="muted">Закрыть</button></div></div>
<script>
(function(){
  var V='12', st={ok:{},err:[]};
  addEventListener('error',function(e){ st.err.push(e.message||'error'); });
  addEventListener('unhandledrejection',function(e){ st.err.push(String((e.reason&&e.reason.message)||e.reason)); });
  function load(src,ms){ return new Promise(function(res){
    var s=document.createElement('script'),done=false,t;
    function fin(ok){ if(done) return; done=true; clearTimeout(t); res(ok); }
    t=setTimeout(function(){ fin(false); },ms); s.async=false; s.onload=function(){ fin(true); }; s.onerror=function(){ fin(false); }; s.src=src; document.head.appendChild(s);
  }); }
  (async function(){
    var cdn=[['jsdelivr','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'],['unpkg','https://unpkg.com/@supabase/supabase-js@2']];
    for(var i=0;i<cdn.length;i++){ if(window.supabase) break; st.ok[cdn[i][0]]=await load(cdn[i][1],8000); }
    st.ok.config=await load('config.js?v='+V,10000);
    st.ok.app=await load('app.js?v='+V,10000);
  })();
  setTimeout(function(){
    var b=document.getElementById('boot'); if(!b||b.hidden) return;
    var d=Object.keys(st.ok).map(function(k){ return k+': '+(st.ok[k]?'ok':'нет'); }).join(', ')+'; supabase: '+(window.supabase?'ok':'нет')+(st.err.length?'; ошибка: '+st.err[0]:'');
    b.innerHTML='<div style="text-align:center;padding:24px;color:#aaa;font:14px/1.5 sans-serif">Не удалось запустить приложение.<br><small>'+d.replace(/</g,'&lt;')+'</small><br><br><button onclick="location.reload()" style="padding:12px 22px;border-radius:12px;background:#fff;color:#000;font-weight:600">Перезагрузить</button></div>';
  },14000);
})();
</script>
</body>
</html>
